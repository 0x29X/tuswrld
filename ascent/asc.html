    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000000;
            color: #ffffff;
            font-family: 'JetBrains Mono', monospace;
            user-select: none;
        }

        .ascent-intro-overlay {
            position: fixed;
            inset: 0;
            z-index: 99999;
            background: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            cursor: default;
            transition: opacity 0.7s cubic-bezier(0.16, 1, 0.3, 1), transform 0.7s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .ascent-intro-overlay.hide {
            opacity: 0;
            transform: scale(1.04);
            pointer-events: none;
        }

        .ascent-intro-wrap {
            position: relative;
            width: clamp(260px, 42vw, 400px);
            aspect-ratio: 1 / 1;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.85s cubic-bezier(0.32, 0.72, 0, 1), opacity 0.65s ease;
        }

        .ascent-intro-wrap.fly {
            transform: scale(0.92);
            opacity: 0;
        }

        .ascent-intro-svg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: visible;
        }

        .trace-cut {
            transition: opacity 0.4s ease;
        }

        .trace-cut path {
            fill: none;
            stroke: #ef4444;
            stroke-width: 2.2px;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .trace-blade {
            transition: opacity 0.35s ease;
        }

        .trace-blade path {
            fill: none;
            stroke: #ffffff;
            stroke-width: 3.2px;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .ascent-real-logo {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transform: scale(0.96);
            transition: opacity 0.65s cubic-bezier(0.16, 1, 0.3, 1), transform 0.65s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: none;
        }

        .ascent-real-logo.visible {
            opacity: 1;
            transform: scale(1);
        }

        .ascent-real-logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .main-page {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            background: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transform: scale(0.96);
            transition: opacity 0.85s cubic-bezier(0.16, 1, 0.3, 1), transform 0.85s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 10;
        }

        .main-page.loaded {
            opacity: 1;
            transform: scale(1);
        }

        .showcase-container {
            display: flex;
            align-items: center;
            justify-content: center;
            max-width: 90vw;
            max-height: 90vh;
        }

        .showcase-image {
            max-width: min(850px, 92vw);
            max-height: 88vh;
            width: auto;
            height: auto;
            object-fit: contain;
        }

    <script>
        (function () {
            const intro = document.getElementById('ascentIntro');
            const introWrap = document.getElementById('introWrap');
            const pathCut = document.getElementById('pathCut');
            const pathBlade = document.getElementById('pathBlade');
            const realLogo = document.getElementById('realLogo');
            const mainPage = document.getElementById('mainPage');

            let animId = null;
            let startTime = null;
            let pathLength = 0;

            function runIntroAnimation() {
                intro.classList.remove('hide');
                introWrap.classList.remove('fly');
                realLogo.classList.remove('visible');
                mainPage.classList.remove('loaded');

                pathCut.style.opacity = '1';
                pathBlade.style.opacity = '1';

                pathLength = pathCut.getTotalLength();

                pathCut.style.strokeDasharray = pathLength;
                pathCut.style.strokeDashoffset = pathLength;

                const bladeLength = Math.max(50, pathLength * 0.12);
                pathBlade.style.strokeDasharray = `${bladeLength} ${pathLength}`;
                pathBlade.style.strokeDashoffset = bladeLength;

                startTime = performance.now();

                const drawDuration = 3400;

                function step(now) {
                    const elapsed = now - startTime;
                    const progress = Math.min(1, elapsed / drawDuration);

                    const eased = 1 - Math.pow(1 - progress, 3.2);

                    const currentOffset = pathLength * (1 - eased);
                    pathCut.style.strokeDashoffset = currentOffset;

                    pathBlade.style.strokeDashoffset = currentOffset + bladeLength;

                    if (progress < 1) {
                        animId = requestAnimationFrame(step);
                    } else {
                        realLogo.classList.add('visible');
                        pathCut.style.opacity = '0';
                        pathBlade.style.opacity = '0';

                        setTimeout(() => {
                            introWrap.classList.add('fly');
                            intro.classList.add('hide');
                            mainPage.classList.add('loaded');
                        }, 700);
                    }
                }

                animId = requestAnimationFrame(step);
            }

            window.addEventListener('DOMContentLoaded', () => {
                runIntroAnimation();
            });
        })();
    </script>
