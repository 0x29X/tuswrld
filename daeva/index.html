<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>@daeva</title>
    <link rel="icon" type="image/x-icon" href="https://file.garden/au7G4rXqsE0SOH3M/main%20tae.png">
    <meta name="description" content="Exclu$ive">
    <meta property="og:title" content="Exclu$ive">
    <meta property="og:description" content="Exclu$ive">
    <meta property="og:image" content="https://file.garden/au7G4rXqsE0SOH3M/main%20tae.png">
    <meta property="og:url" content="https://tuswrld.xyz/daeva">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:image" content="https://file.garden/au7G4rXqsE0SOH3M/main%20tae.png">
    <meta name="theme-color" content="#000000">
    <script disable-devtool-auto src="https://cdn.jsdelivr.net/npm/disable-devtool"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Kanit:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">

    <style>
        :root {
            --font-kanit: 'Kanit', Arial, Helvetica, sans-serif;
            --accent: #ffffff;
            --side-card-height: 136px;
            --side-panel-height: 450px;
        }

        *,
        ::before,
        ::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            border: 0 solid rgba(255, 255, 255, 0.12);
            cursor: url('https://drift.rip/media/users/cursors/cursor_3867_69bb11919e3619.60058093.png'), auto !important;
        }

        html {
            -webkit-text-size-adjust: 100%;
            line-height: 1.5;
            font-family: var(--font-kanit);
            scrollbar-width: thin;
            scrollbar-color: #ffffff1f transparent;
        }

        body {
            min-height: 100dvh;
            background-color: #050505;
            color: #ffffff;
            font-family: var(--font-kanit);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow-x: hidden;
            position: relative;
        }

        a {
            color: inherit;
            text-decoration: inherit;
        }

        button,
        input {
            font-family: inherit;
            font-size: 100%;
            font-weight: inherit;
            line-height: inherit;
            color: inherit;
            background-color: transparent;
        }

        img,
        svg,
        video,
        canvas,
        audio {
            display: block;
            vertical-align: middle;
        }

        img,
        video {
            max-width: 100%;
            height: auto;
        }

        .site-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
            background: #000000;
        }

        .site-bg-layer {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            transition: opacity 0.55s ease;
        }

        .site-bg-default {
            opacity: 1;
            background: #000000;
        }

        #codeBgCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .site-bg-overlay {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, rgba(5, 5, 5, 0.18) 0%, rgba(5, 5, 5, 0.72) 100%);
            z-index: 2;
        }

        .dp-shade {
            z-index: 1;
            pointer-events: none;
            background-image:
                linear-gradient(#ffffff08 1px, #0000 1px),
                linear-gradient(90deg, #ffffff08 1px, #0000 1px),
                repeating-linear-gradient(0deg, #ffffff05 0 1px, #0000 1px 4px),
                linear-gradient(#0000002e, #000000c7);
            background-size: 7px 7px, 7px 7px, 100% 4px, 100% 100%;
            width: 100%;
            height: 100%;
            position: fixed;
            inset: 0;
            box-shadow: inset 0 0 170px #000000a3;
        }

        .dp-shade::after {
            content: "";
            opacity: .44;
            mix-blend-mode: overlay;
            pointer-events: none;
            background-image: radial-gradient(circle, #ffffff0d 0 1px, #0000 1px 100%);
            background-size: 7px 7px;
            position: absolute;
            inset: 0;
        }

        .dp-stage {
            position: relative;
            z-index: 10;
            display: flex;
            min-height: 100dvh;
            align-items: center;
            justify-content: center;
            padding: 5rem 1rem;
        }

        .dp-root {
            --accent: #ffffff;
            --side-card-height: 136px;
            --side-panel-height: 450px;
            font-family: var(--font-kanit);
            color: #fff;
            width: 100%;
            max-width: 1260px;
            margin-inline: auto;
        }

        .dp-root h1,
        .dp-root h2 {
            font-weight: 600;
        }

        .dp-layout {
            perspective: 1100px;
            grid-template-columns: minmax(260px, 330px) minmax(540px, 700px) minmax(260px, 330px);
            justify-content: center;
            align-items: center;
            gap: 86px;
            width: min(1260px, 100%);
            margin-top: 0;
            margin-inline: auto;
            animation: .8s cubic-bezier(.16, 1, .3, 1) both dpFadeSlideIn;
            display: grid;
            position: relative;
        }

        .dp-layout::before {
            display: none;
        }

        .dp-center-column {
            transform-origin: 50%;
            display: grid;
            position: relative;
            transform: scale(1.04);
        }

        @keyframes dpFadeSlideIn {
            0% {
                opacity: 0;
                transform: translateY(12px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .dp-card {
            border-radius: 8px;
            gap: 0;
            padding: 0;
            display: grid;
            overflow: visible;
        }

        .dp-card .dp-avatar-wrap {
            animation:
                .7s cubic-bezier(.16, 1, .3, 1) .55s both dpFadeSlideIn,
                2.4s ease-in-out 1.25s infinite alternate dpAvatarSwing,
                1.2s ease-in-out 1.25s infinite alternate dpAvatarBob;
        }

        .dp-card .dp-name-block {
            animation: .7s cubic-bezier(.16, 1, .3, 1) .7s both dpFadeSlideIn;
        }

        .dp-card .dp-badge-row {
            animation: .7s cubic-bezier(.16, 1, .3, 1) .85s both dpFadeSlideIn;
        }

        .dp-card .dp-link-stack {
            animation: .7s cubic-bezier(.16, 1, .3, 1) 1s both dpFadeSlideIn;
        }

        .dp-body {
            z-index: 2;
            margin-top: 0;
            position: relative;
            overflow: visible;
        }

        .dp-identity {
            z-index: 11;
            text-align: center;
            flex-direction: column;
            align-items: center;
            gap: 34px;
            margin-top: 0;
            padding: 0 18px;
            display: flex;
            position: relative;
        }

        .dp-avatar-wrap {
            z-index: 4;
            width: 168px;
            height: 168px;
            box-shadow: none;
            background: #111a15;
            border-radius: 50%;
            flex: none;
            place-items: center;
            display: grid;
            position: relative;
            overflow: visible;
        }

        @keyframes dpAvatarSwing {
            0% {
                transform: perspective(600px) rotateX(-12deg) rotateY(-18deg);
            }

            to {
                transform: perspective(600px) rotateX(12deg) rotateY(18deg);
            }
        }

        @keyframes dpAvatarBob {
            0% {
                translate: 0 3px;
            }

            to {
                translate: 0 -10px;
            }
        }

        .dp-avatar-wrap::after {
            content: "";
            z-index: 2;
            border: 1px solid #ffffff29;
            border-radius: inherit;
            pointer-events: none;
            position: absolute;
            inset: -4px;
        }

        .dp-avatar-wrap img.dp-avatar-img {
            border-radius: inherit;
            object-fit: cover;
            width: 100%;
            height: 100%;
        }

        .dp-avatar-decoration {
            position: absolute;
            inset: -12%;
            width: 124%;
            height: 124%;
            max-width: none;
            border-radius: 0;
            pointer-events: none;
            z-index: 3;
            display: none;
        }

        .dp-status-dot {
            z-index: 4;
            background: #6b716d;
            border: 4px solid #090c0b;
            border-radius: 50%;
            width: 26px;
            height: 26px;
            position: absolute;
            bottom: 15px;
            right: 13px;
        }

        .dp-status-dot.online {
            background: #33d17a;
        }

        .dp-status-dot.idle {
            background: #f6c177;
        }

        .dp-status-dot.dnd {
            background: #ff5f57;
        }

        .dp-status-dot.offline {
            background: #6b716d;
        }

        .dp-server-tag {
            color: #ffffffd9;
            background: #ffffff0f;
            border: 1px solid #ffffff1f;
            border-radius: 999px;
            align-items: center;
            gap: 6px;
            margin-bottom: 6px;
            padding: 3px 10px 3px 3px;
            font-size: .72rem;
            font-weight: 600;
            display: inline-flex;
        }

        .dp-server-tag-icon {
            object-fit: cover;
            border-radius: 50%;
            width: 20px;
            height: 20px;
        }

        .dp-name-block {
            z-index: 6;
            min-width: 0;
            position: relative;
            overflow: visible;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .dp-name-block h1 {
            letter-spacing: 0;
            color: #0000;
            -webkit-text-stroke: 1px #ffffff38;
            filter: drop-shadow(0 0 6px #fff6) drop-shadow(0 0 22px #fff3);
            background-image: linear-gradient(90deg, #c4c4c4 0%, #7a7a7a 22%, #161616 42%, #7a7a7a 62%, #c4c4c4 80% 100%);
            background-size: 200% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            margin: 0 0 .2rem;
            font-size: 3.72rem;
            line-height: 1.1;
            animation: 7s linear infinite dpNameGradient;
            position: relative;
            overflow: visible;
        }

        @keyframes dpNameGradient {
            to {
                background-position: 200% 0;
            }
        }

        .dp-name-block h1::before {
            content: attr(data-text);
            color: #0000;
            -webkit-text-stroke: 2px #fffffff2;
            pointer-events: none;
            animation: 5s ease-in-out infinite alternate dpNameGlowSweep;
            position: absolute;
            inset: 0;
            -webkit-mask-image: linear-gradient(90deg, #0000 35%, #000 48% 52%, #0000 65%);
            mask-image: linear-gradient(90deg, #0000 35%, #000 48% 52%, #0000 65%);
            -webkit-mask-size: 200% 100%;
            mask-size: 200% 100%;
        }

        @keyframes dpNameGlowSweep {
            0% {
                -webkit-mask-position: 200% 0;
                mask-position: 200% 0;
            }

            to {
                -webkit-mask-position: -100% 0;
                mask-position: -100% 0;
            }
        }

        .dp-name-block .dp-username {
            color: #ffffffa6;
            letter-spacing: .03em;
            margin-top: .2rem;
            font-size: .9rem;
        }

        .dp-name-block .dp-bio {
            color: #ffffffad;
            max-width: 42ch;
            margin: 10px auto 0;
            font-size: .86rem;
            line-height: 1.45;
            min-height: 1.45em;
        }

        @keyframes blink-cursor {

            0%,
            49% {
                opacity: 1;
            }

            50%,
            100% {
                opacity: 0;
            }
        }

        .animate-blink-cursor {
            display: inline-block;
            margin-left: 2px;
            animation: 1.2s step-end infinite blink-cursor;
        }

        .dp-name-block .dp-activity-line {
            color: #ffffff80;
            text-transform: uppercase;
            letter-spacing: .06em;
            align-items: center;
            gap: 6px;
            margin: 10px 0 0;
            font-size: .68rem;
            display: inline-flex;
        }

        .dp-name-block .dp-activity-line svg {
            color: #ffffff;
            flex: none;
        }

        .dp-stats-row {
            justify-content: center;
            align-items: center;
            gap: 18px;
            margin-top: 12px;
            display: flex;
        }

        .dp-like-btn {
            color: #ffffffbf;
            cursor: pointer;
            background: 0 0;
            border: none;
            align-items: center;
            gap: 6px;
            padding: 0;
            font-size: .78rem;
            font-weight: 600;
            transition: color .2s, transform .2s;
            display: inline-flex;
        }

        .dp-like-btn:hover {
            transform: scale(1.06);
        }

        .dp-like-btn.is-liked {
            color: #ff5f57;
            cursor: default;
        }

        .dp-view-count {
            color: #ffffffa6;
            align-items: center;
            gap: 6px;
            font-size: .78rem;
            display: inline-flex;
        }

        .dp-badge-row {
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin: 14px 18px 0;
            display: flex;
        }

        .dp-badge {
            justify-content: center;
            align-items: center;
            display: inline-flex;
            color: #fff;
        }

        .dp-badge svg {
            color: #fff;
            width: 22px;
            height: 22px;
            filter:
                drop-shadow(0 0 2px rgba(255, 255, 255, .7)) drop-shadow(0 0 6px rgba(255, 255, 255, .4)) drop-shadow(0 0 15px rgba(255, 255, 255, .2)) drop-shadow(0 0 30px rgba(255, 255, 255, .1));
        }

        .dp-badge-icon {
            object-fit: contain;
            filter:
                brightness(0) invert() drop-shadow(0 0 2px #ffffffb3) drop-shadow(0 0 6px #fff6) drop-shadow(0 0 15px #fff3) drop-shadow(0 0 30px #ffffff1a);
            width: 22px;
            height: 22px;
        }

        .dp-link-stack {
            flex-flow: wrap;
            justify-content: center;
            gap: 8px;
            height: auto;
            margin-top: 14px;
            display: flex;
            overflow-y: hidden;
        }

        .dp-link-tile {
            width: 46px;
            height: 46px;
            color: inherit;
            background: #ffffff0f;
            border: 1.5px solid #ffffff3d;
            border-radius: 50%;
            flex: 0 0 46px;
            justify-content: center;
            align-items: center;
            padding: 0 10px;
            font-size: .8rem;
            text-decoration: none;
            transition: border-color .16s, background .16s, box-shadow .16s, transform .16s;
            display: flex;
            position: relative;
            box-shadow: 0 1px 6px #0006;
        }

        .dp-link-tile:hover {
            background: #ffffff1a;
            border-color: #fff6;
            box-shadow: inset 0 0 0 1px #ffffff0f, 0 0 14px #ffffff14;
            transform: translateY(-2px);
        }

        .dp-link-tile span {
            clip: rect(0 0 0 0);
            white-space: nowrap;
            width: 1px;
            height: 1px;
            position: absolute;
            overflow: hidden;
        }

        .dp-link-tile-icon {
            object-fit: contain;
            width: 20px;
            height: 20px;
            display: block;
            filter: brightness(0) invert(1);
        }

        .dp-link-tile svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        .dp-presence-wrap {
            margin: 16px auto 0;
            width: 100%;
            max-width: 24rem;
        }

        .dp-presence-card {
            position: relative;
            overflow: hidden;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.07);
            background: rgba(255, 255, 255, 0.025);
            padding: 10px;
            text-align: left;
            backdrop-filter: blur(12px);
        }

        .dp-presence-inner {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .dp-presence-art {
            position: relative;
            width: 44px;
            height: 44px;
            flex-shrink: 0;
            overflow: hidden;
            border-radius: 3px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.03);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .dp-presence-art img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .dp-presence-copy {
            min-width: 0;
            flex: 1;
        }

        .dp-presence-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .dp-presence-label-group {
            display: flex;
            min-width: 0;
            align-items: center;
            gap: 6px;
        }

        .dp-presence-label {
            font-size: 8px;
            text-transform: uppercase;
            letter-spacing: 0.24em;
            color: rgba(255, 255, 255, 0.35);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .dp-presence-meta {
            display: flex;
            flex-shrink: 0;
            align-items: center;
            gap: 8px;
        }

        .dp-eq {
            display: flex;
            height: 10px;
            align-items: flex-end;
            gap: 2px;
        }

        .dp-eq span {
            width: 2px;
            height: 10px;
            background: rgba(255, 255, 255, 0.45);
            transform-origin: bottom;
            animation: dpEqBar 1.4s ease-in-out infinite;
        }

        .dp-eq span:nth-child(2) {
            animation-delay: 0.18s;
        }

        .dp-eq span:nth-child(3) {
            animation-delay: 0.36s;
        }

        @keyframes dpEqBar {

            0%,
            100% {
                transform: scaleY(0.3);
            }

            25% {
                transform: scaleY(1);
            }

            50% {
                transform: scaleY(0.45);
            }

            75% {
                transform: scaleY(0.8);
            }
        }

        .dp-presence-time {
            font-size: 9px;
            font-variant-numeric: tabular-nums;
            letter-spacing: 0.05em;
            color: rgba(255, 255, 255, 0.3);
        }

        .dp-presence-title {
            margin-top: 5px;
            font-size: 13px;
            line-height: 1.15;
            color: rgba(255, 255, 255, 0.9);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .dp-presence-subtitle {
            margin-top: 4px;
            font-size: 10px;
            line-height: 1.15;
            color: rgba(255, 255, 255, 0.4);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .dp-presence-progress {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: 2px;
            background: rgba(255, 255, 255, 0.06);
        }

        .dp-presence-progress-bar {
            height: 100%;
            width: 0%;
            background: rgba(255, 255, 255, 0.6);
            transition: width 1s linear;
        }

        .dp-panel {
            height: var(--side-panel-height);
            -webkit-backdrop-filter: blur(20px);
            backdrop-filter: blur(20px);
            opacity: .85;
            will-change: opacity;
            background: #070808ad;
            border: 1px solid #fff3;
            border-radius: 8px;
            padding: 10px;
            transition: opacity .2s;
            position: relative;
            overflow: hidden;
            transform-origin: 50%;
            box-shadow:
                inset 0 1px 0 #ffffff38,
                0 40px 70px -24px #000000b3;
        }

        .dp-panel:hover {
            opacity: 1;
        }

        .dp-layout>.dp-music-panel {
            animation: 6s ease-in-out infinite alternate dpPanelSwayLeft;
            transform: rotateY(26deg) rotateX(3deg);
        }

        .dp-layout>.dp-panel:not(.dp-music-panel) {
            animation: 6s ease-in-out -3s infinite alternate dpPanelSwayRight;
            transform: rotateY(-26deg) rotateX(3deg);
        }

        .dp-layout>.dp-panel:hover {
            animation-play-state: paused;
        }

        @keyframes dpPanelSwayLeft {
            0% {
                transform: translateY(0) rotateY(20deg) rotateX(4deg);
            }

            to {
                transform: translateY(-8px) rotateY(32deg) rotateX(-1deg);
            }
        }

        @keyframes dpPanelSwayRight {
            0% {
                transform: translateY(0) rotateY(-20deg) rotateX(4deg);
            }

            to {
                transform: translateY(-8px) rotateY(-32deg) rotateX(-1deg);
            }
        }

        .dp-panel::after {
            content: "";
            z-index: 5;
            border-radius: inherit;
            pointer-events: none;
            background: linear-gradient(115deg, transparent 38%, #ffffff1a 50%, transparent 62%);
            mix-blend-mode: screen;
            background-position: 160% 0;
            background-size: 260% 100%;
            animation: 6.5s ease-in-out infinite dpPanelSweep;
            position: absolute;
            inset: 0;
        }

        .dp-layout>.dp-panel:not(.dp-music-panel)::after {
            animation-delay: -3.2s;
        }

        @keyframes dpPanelSweep {
            0% {
                background-position: 160% 0;
            }

            60%,
            to {
                background-position: -60% 0;
            }
        }

        .dp-music-panel {
            align-content: center;
            align-self: center;
            display: grid;
        }

        .dp-music-player {
            text-align: center;
            grid-template-columns: 1fr;
            align-self: center;
            place-items: center;
            gap: 10px;
            height: auto;
            width: 100%;
            display: grid;
        }

        .dp-disc {
            background-color: #ffffff08;
            background-image: linear-gradient(135deg, #ffffff2b, #ffffff05);
            border-radius: 8px;
            grid-column: 1 / -1;
            place-items: center;
            width: 72px;
            height: 72px;
            display: grid;
        }

        .dp-disc svg {
            animation: 3.2s linear infinite dpDiscSpin;
        }

        .dp-disc.has-cover {
            background-image: none;
            padding: 0;
            overflow: hidden;
        }

        .dp-disc-cover {
            object-fit: cover;
            border-radius: inherit;
            width: 100%;
            height: 100%;
        }

        @keyframes dpDiscSpin {
            to {
                transform: rotate(360deg);
            }
        }

        .dp-track-copy {
            max-width: 100%;
            overflow: hidden;
            padding: 0 8px;
        }

        .dp-track-copy span {
            color: #ffffffad;
            text-transform: uppercase;
            letter-spacing: .05em;
            align-items: center;
            justify-content: center;
            gap: 4px;
            font-size: .72rem;
            display: inline-flex;
        }

        .dp-track-copy h2 {
            margin: 4px 0 1px;
            font-size: 1rem;
            line-height: 1.08;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .dp-track-copy p {
            color: #ffffffad;
            margin: 0;
            font-size: .78rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .dp-play-button {
            color: #fff;
            cursor: pointer;
            background: #090c0b94;
            border: 1px solid #ffffff1f;
            border-radius: 50%;
            place-items: center;
            width: 34px;
            height: 34px;
            display: grid;
            transition: border-color 0.2s, background 0.2s, transform 0.2s;
        }

        .dp-play-button:hover {
            border-color: #ffffff4d;
            background: #ffffff14;
            transform: scale(1.06);
        }

        .dp-progress {
            cursor: pointer;
            background: #ffffff1f;
            border-radius: 999px;
            grid-column: 1 / -1;
            width: 100%;
            height: 6px;
            position: relative;
            overflow: hidden;
        }

        .dp-progress span {
            border-radius: inherit;
            background: linear-gradient(90deg, #ffffff, #ffffffd9);
            width: 0%;
            height: 100%;
            transition: width .2s linear;
            display: block;
        }

        .dp-music-volume-row {
            opacity: .85;
            justify-content: center;
            align-items: center;
            gap: 6px;
            margin-top: 4px;
            display: flex;
        }

        .dp-music-volume-row button {
            color: inherit;
            cursor: pointer;
            background: 0 0;
            border: none;
            place-items: center;
            padding: 0;
            display: grid;
        }

        .dp-music-volume-row input[type=range] {
            -webkit-appearance: none;
            appearance: none;
            cursor: pointer;
            background: #fff3;
            border-radius: 999px;
            outline: none;
            width: 64px;
            height: 3px;
        }

        .dp-music-volume-row input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            background: #fff;
            border-radius: 50%;
            width: 10px;
            height: 10px;
        }

        .dp-music-volume-row input[type=range]::-moz-range-thumb {
            background: #fff;
            border: 0;
            border-radius: 50%;
            width: 10px;
            height: 10px;
        }

        .dp-music-clock {
            border-top: 1px solid #ffffff1f;
            grid-column: 1 / -1;
            align-self: end;
            justify-items: center;
            gap: 6px;
            padding-top: 12px;
            width: 100%;
            display: grid;
        }

        .dp-music-clock span.dp-clock-loc {
            color: #ffffffb3;
            align-items: center;
            gap: 6px;
            font-size: .78rem;
            display: inline-flex;
        }

        .dp-music-clock strong {
            font-size: 1.6rem;
            line-height: 1;
            font-variant-numeric: tabular-nums;
        }

        .dp-music-clock p {
            color: #ffffff8c;
            align-items: center;
            gap: 4px;
            margin: 0;
            font-size: .72rem;
            display: flex;
        }

        .dp-server-grid {
            scrollbar-width: none;
            flex-direction: column;
            justify-content: flex-start;
            gap: 10px;
            height: 100%;
            min-height: 0;
            padding: 10px;
            display: flex;
            overflow-y: auto;
        }

        .dp-server-grid::-webkit-scrollbar {
            display: none;
        }

        .dp-server-card {
            height: auto;
            min-height: var(--side-card-height);
            color: inherit;
            background: #ffffff08;
            border: 1px solid #ffffff1f;
            border-radius: 8px;
            grid-template-columns: 1fr;
            text-decoration: none;
            transition: border-color .16s, background .16s, box-shadow .16s;
            display: grid;
            overflow: hidden;
        }

        .dp-server-card:hover {
            background: #ffffff0f;
            border-color: #ffffff38;
            box-shadow: inset 0 0 0 1px #ffffff0a, 0 0 14px #ffffff0a;
        }

        .dp-server-banner {
            color: #ffffff9e;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: .08em;
            background-color: #101211;
            background-image:
                linear-gradient(128deg, #ffffff1c, #ffffff0a),
                linear-gradient(#ffffff0f 1px, #0000 1px),
                linear-gradient(90deg, #ffffff0a 1px, #0000 1px);
            background-size: cover, 8px 8px, 8px 8px;
            place-items: center;
            min-height: 58px;
            font-size: .68rem;
            display: grid;
        }

        .dp-server-banner.has-image {
            background-image: var(--server-banner-image);
            background-position: 50%;
            background-size: cover;
        }

        .dp-server-banner.from-icon {
            position: relative;
            overflow: hidden;
        }

        .dp-server-banner.from-icon::before {
            content: "";
            background-image: var(--server-banner-image);
            filter: blur(22px) saturate(1.35) brightness(.7);
            background-position: 50%;
            background-size: cover;
            position: absolute;
            inset: -40%;
        }

        .dp-server-body {
            align-content: center;
            gap: 6px;
            min-width: 0;
            min-height: 78px;
            padding: 10px 12px;
            display: grid;
            overflow: hidden;
        }

        .dp-server-heading {
            align-items: center;
            gap: 8px;
            min-width: 0;
            display: flex;
        }

        .dp-server-heading-copy {
            min-width: 0;
        }

        .dp-server-icon {

            border-radius: 50%;

            width: 26px;
            height: 26px;
        }

            line-height: 1.25;

        .dp-server-body p {
            color: #ffffffad;

            margin: 0;
            font-size: .78rem;
            line-height: 1.35;

        .dp-server-meta {
            justify-content: space-between;
            gap: 8px;
            font-size: .62rem;
            color: rgba(255, 255, 255, 0.7);
            display: flex;
        }

        @media (max-width: 1080px) {
