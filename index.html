    <script>
        (function () {
            const text = "tuswrld is a high-energy digital collective, bringing together individuals driven by curiosity, creativity, and a deep interest in the ever-evolving digital world. Built from a shared passion for learning and exploration, tuswrld has grown into a community where ideas, skills, and modern internet culture converge.\n\nMore than just a community, tuswrld represents a mindset \u2014 staying curious, thinking independently, mastering your craft, and knowing how to use what you learn with purpose. We believe that knowledge becomes meaningful through discipline, awareness, and responsible action.";

            function stylize(t) {
                return t
                    .replace(/tuswrld/g, '<strong class="about-highlight">tuswrld</strong>')
                    .replace(/\n/g, '<br>');
            }

            const el = document.getElementById("aboutTypingText");
            const cursor = document.getElementById("aboutTypingCursor");
            if (!el) return;

            const TYPE_SPEED = 24;
            let i = 0;

            function step() {
                i++;
                el.innerHTML = stylize(text.slice(0, i));

                if (i >= text.length) {
                    setTimeout(function () {
                        if (cursor) cursor.classList.add("done");
                    }, 1200);
                    return;
                }
                setTimeout(step, TYPE_SPEED);
            }

            const section = document.querySelector(".about-section");
            let started = false;

            if (section && "IntersectionObserver" in window) {
                const obs = new IntersectionObserver(function (entries) {
                    if (entries[0].isIntersecting && !started) {
                        started = true;
                        step();
                        obs.disconnect();
                    }
                }, { threshold: 0.15 });
                obs.observe(section);
            } else {
                step();
            }

            var reveals = document.querySelectorAll(
                ".about-section, .about-image, .about-content, " +
                ".member-section, .affil-card, .footer"
            );

            if ("IntersectionObserver" in window) {
                var revealObs = new IntersectionObserver(function (entries) {
                    entries.forEach(function (entry) {
                        if (entry.isIntersecting) {
                            entry.target.classList.add("is-visible");
                            revealObs.unobserve(entry.target);
                        }
                    });
                }, { threshold: 0.1, rootMargin: "0px 0px -40px 0px" });

                reveals.forEach(function (el) {
                    el.classList.add("scroll-reveal");
                    revealObs.observe(el);
                });
            }
        })();
    </script>
