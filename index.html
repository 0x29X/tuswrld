  (function initLightning() {
    const canvas = document.getElementById('lightningCanvas');
    const flash = document.getElementById('lightningTarget');

    if (!canvas || !flash || !bg) return;
    const ctx = canvas.getContext('2d');
    let bolts = [];

    const resize = () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; };
    window.addEventListener('resize', resize, { passive: true });
    resize();

    const genSegments = (x1, y1, x2, y2, disp, minLen = 8) => {
      let segs = [];
      const rec = (a, b, c, d, dp) => {
        const dx = c - a, dy = d - b;
        const dist = Math.sqrt(dx*dx + dy*dy);
        if (dist < minLen) { segs.push({ x1:a, y1:b, x2:c, y2:d }); return; }
        let mx = (a+c)/2, my = (b+d)/2;
        mx += (Math.random()-0.5)*dp;
        my += (Math.random()-0.5)*dp;
        rec(a, b, mx, my, dp*0.55);
        rec(mx, my, c, d, dp*0.55);
      };
      rec(x1, y1, x2, y2, disp);
      return segs;
    };

    const createBolt = () => {
      const edge = ['top','bottom','left','right'][Math.floor(Math.random()*4)];
      let sx, sy;
      if (edge === 'top') { sx = Math.random()*canvas.width; sy = 0; }
      else if (edge === 'bottom') { sx = Math.random()*canvas.width; sy = canvas.height; }
      else if (edge === 'left') { sx = 0; sy = Math.random()*canvas.height; }
      else { sx = canvas.width; sy = Math.random()*canvas.height; }
      const tx = canvas.width*0.3 + Math.random()*canvas.width*0.4;
      const ty = canvas.height*0.3 + Math.random()*canvas.height*0.4;
      let main = genSegments(sx, sy, tx, ty, 140);
      let branches = [];
      main.forEach((s, i) => {
        if (i>0 && i%4===0 && Math.random()<0.35) {
          const bx = (Math.random()-0.5)*160, by = (Math.random()-0.5)*160;
          branches.push(genSegments(s.x1, s.y1, s.x1+bx, s.y1+by, 40));
        }
      });
      return { main, branches, opacity: 1.0 };
    };

    const drawBolt = (b) => {
      ctx.save();
      ctx.strokeStyle = '#fff';
      ctx.shadowColor = 'oklch(0.60 0.25 25)';
      ctx.shadowBlur = 24;
      ctx.lineWidth = Math.random()*2 + 1.8;
      ctx.globalAlpha = b.opacity;
      const drawSegs = (segs) => { if(!segs.length) return; ctx.beginPath(); ctx.moveTo(segs[0].x1, segs[0].y1); segs.forEach(s=>ctx.lineTo(s.x2,s.y2)); ctx.stroke(); };
      drawSegs(b.main);
      ctx.lineWidth *= 0.5;
      ctx.shadowBlur = 12;
      b.branches.forEach(br=>drawSegs(br));
      ctx.restore();
    };

    let animId = null;
    const render = () => {
      ctx.clearRect(0,0,canvas.width,canvas.height);
      if (bolts.length) {
        bolts.forEach(b=>drawBolt(b));
        bolts = bolts.filter(b=> (b.opacity -= 0.08) > 0 );
        animId = requestAnimationFrame(render);
      } else {
        isStriking = false;
        if (animId) { cancelAnimationFrame(animId); animId = null; }
      }
    };

    const strike = () => {
      if (isStriking) return;
      isStriking = true;
      const ambient = Math.random() > 0.4 ? 0.18 : 0.15;
      const hold = Math.random() > 0.4 ? 50 : 40;
      bolts.push(createBolt());

        bg.style.filter = `blur(${backgroundConfig.blurAmount})`;
      }, hold);
      render();
      setTimeout(() => { strike(); }, Math.floor(Math.random()*8000)+4000);
    };
    setTimeout(strike, 1500);
  })();

  (function initParticles() {
    const canvas = document.getElementById('bgParticles');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    let parts = [];
    const resize = () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; };
    window.addEventListener('resize', resize, { passive: true });
    resize();
    class Particle {
      constructor() {
        this.x = Math.random()*canvas.width;
        this.y = Math.random()*canvas.height;
        this.base = Math.random()*1.5 + 0.5;
        this.size = this.base;
        this.vx = (Math.random()-0.5)*0.4;
        this.vy = (Math.random()-0.5)*0.4;
        this.alpha = Math.random()*0.5 + 0.15;
      }
      draw() {
        ctx.fillStyle = `rgba(235,235,245,${this.alpha})`;
        ctx.beginPath(); ctx.arc(this.x,this.y,this.size,0,Math.PI*2); ctx.fill();
      }
      update() {
        this.x += this.vx; this.y += this.vy;
        const dx = mouseTracker.x - this.x;
        const dy = mouseTracker.y - this.y;
        const dist = dx*dx + dy*dy;
        if (dist < 14400) {
          const f = (14400 - dist) / 14400;
          this.x -= (dx/10)*f; this.y -= (dy/10)*f;
          this.size = this.base * (1 + f*0.8);
        } else { this.size = this.base; }
        if (this.x<0 || this.x>canvas.width) this.vx *= -1;
        if (this.y<0 || this.y>canvas.height) this.vy *= -1;
      }
    }
    const init = () => {
      parts = [];
      const count = Math.min(80, Math.floor((canvas.width*canvas.height)/20000));
      for (let i=0; i<count; i++) parts.push(new Particle());
    };
    init();
    const loop = () => {
      ctx.clearRect(0,0,canvas.width,canvas.height);
      parts.forEach(p=>{ p.update(); p.draw(); });
      requestAnimationFrame(loop);
    };
    loop();
  })();

            }
            return { name, tag, online, iconUrl, invite: `https://discord.gg/${aff.inviteCode.trim()}` };
          }).catch(() => ({ name: aff.fallbackName, tag: aff.fallbackTag, online: 0, iconUrl: null, invite: `https://discord.gg/${aff.inviteCode.trim()}` }));
      }));
    } catch (e) { console.error(e); }

    html += `<section class="tier"><div class="tier-head"><h2>AFFILIATES</h2></div><div class="grid-aff">`;
    affData.forEach((a, i) => {
      const visual = a.iconUrl ? `<img src="${a.iconUrl}" alt="" class="server-icon" loading="lazy">` : `<div class="aff-placeholder">${esc(a.name.charAt(0).toUpperCase())}</div>`;
      html += `<a href="${a.invite}" target="_blank" rel="noopener" class="aff up js-glow-card js-tilt-card" style="animation-delay:${i*30}ms">
        ${visual}<div class="info"><div class="n">${esc(a.name)}</div><div class="t">${esc(a.tag)}</div></div>
        <div class="stat"><div class="row"><span class="pulse"></span>${a.online.toLocaleString()}</div><div class="lbl">online</div></div>
      </a>`;
    });
    html += `</div></section>`;

    root.innerHTML = html;

    let tick = false;
    document.addEventListener('mousemove', e => {
      mouseTracker.x = e.clientX; mouseTracker.y = e.clientY;
      if (!tick) {
        requestAnimationFrame(() => {
          const cards = document.querySelectorAll('.js-glow-card');
          cards.forEach(card => {
            const r = card.getBoundingClientRect();
            const x = e.clientX - r.left, y = e.clientY - r.top;
            card.style.setProperty('--mouse-x', `${x}px`);
            card.style.setProperty('--mouse-y', `${y}px`);
            if (card.classList.contains('js-tilt-card') && x>=0 && y>=0 && x<=r.width && y<=r.height) {
              const cx = r.width/2, cy = r.height/2;
              card.style.transform = `perspective(600px) rotateX(${((y-cy)/cy)*-6}deg) rotateY(${((x-cx)/cx)*6}deg)`;
            }
          });
          tick = false;
        });
        tick = true;
      }
    }, { passive: true });
    document.addEventListener('mouseout', e => {
      const card = e.target.closest('.js-tilt-card');
      if (card && !card.contains(e.relatedTarget)) card.style.transform = 'perspective(600px) rotateX(0deg) rotateY(0deg)';
      if (!e.relatedTarget || e.relatedTarget.nodeName === "HTML") { mouseTracker.x = -1000; mouseTracker.y = -1000; }
    }, { passive: true });

    toggleAppView('lobby');
  };

  tuswrldbalagbag();
</script>
</body>
</html>
